name: Deploy to Heroku

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Check Heroku deployment configuration
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
        run: |
          if [ -z "${HEROKU_API_KEY}" ] || [ -z "${HEROKU_EMAIL}" ]; then
            echo "Heroku deployment secrets are not configured. Skipping deploy."
            echo "Set HEROKU_API_KEY and HEROKU_EMAIL in GitHub Secrets to enable automatic deploys."
            exit 0
          fi

      - name: Deploy to Heroku
        if: ${{ secrets.HEROKU_API_KEY != '' && secrets.HEROKU_EMAIL != '' }}
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: warehouse-ops-platform-eu
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          usedocker: false